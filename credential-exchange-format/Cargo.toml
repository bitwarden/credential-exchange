[package]
name = "credential-exchange-format"
description = "Credential Exchange Format (CXF) rust types"

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true

[features]
zeroize = ["dep:zeroize", "dep:zeroize_derive"]

[dependencies]
chrono = { version = "0.4", features = [
    "serde",
    "std",
], default-features = false }
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Later minor releases require Rust 1.85; preserve this crate's Rust 1.75 MSRV.
zeroize = { version = "~1.8", optional = true }
zeroize_derive = { version = "~1.4", optional = true }
